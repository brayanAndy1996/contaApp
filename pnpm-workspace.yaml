packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# 007b T11: fija is-unsafe (transitiva de fast-xml-parser) en una versión publicada hace >= 2 semanas.
# 040: fast-xml-parser 5.12.0 exige is-unsafe ^2.0.3; la 2.0.3 es de 2026-11-03 (>= 2 semanas).
# 040: fast-xml-builder (transitiva de 5.12.0, ^1.3.1) fijada en 1.3.1 (2026-08-14): pnpm elegiría 1.3.2 (2026-11-13, < 2 semanas). Sin aviso de auditoría.
# 040: @nestjs/platform-express 12.3.0 trae multer 2.5.0 (GHSA-q7qp-rjg7-q26m). El peer de @nestjs/core en apps/worker
#      lo auto-instalaría en 12.5.1 (2026-11-16, < 2 semanas); se fija 12.3.0 para que solo haya una versión.
overrides:
  is-unsafe: 2.0.3
  fast-xml-builder: 1.3.1
  "@nestjs/platform-express": 12.3.0
