# Servicios locales de desarrollo (spec 019). Las apps (frontend, backend, worker) corren con pnpm, fuera de Docker.
# Mismas imágenes que el job `aislamiento` de .github/workflows/ci.yml, pero con contraseña en PostgreSQL (no trust).
# Uso: pnpm servicios:up  ·  pnpm servicios:down (conserva datos)  ·  docker compose down -v (borra la BD).
# Variables (de .env o del entorno, con defecto): ver .env.example.
name: contapp

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: contapp
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Solo desarrollo. Se aplica al crear el volumen: para cambiarla, down -v.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contapp_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h): durante initdb la imagen tiene un servidor temporal solo por socket.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
