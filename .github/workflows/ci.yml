name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Instalar, lint, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm (versión de packageManager en package.json)
        uses: pnpm/action-setup@v6

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  aislamiento:
    name: Aislamiento entre estudios (PostgreSQL 17)
    runs-on: ubuntu-latest
    env:
      MIGRATIONS_DATABASE_URL: postgresql://postgres@localhost:5432/contapp
      KEY_PROVIDER: mock
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm (versión de packageManager en package.json)
        uses: pnpm/action-setup@v6

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generar DATABASE_URL del rol de app (contraseña por corrida)
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${PASS}"
          echo "DATABASE_URL=postgresql://contapp_app:${PASS}@localhost:5432/contapp" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de @contapp/db
        run: pnpm --filter @contapp/db build

      - name: Build de @contapp/crypto
        run: pnpm --filter @contapp/crypto build

      - name: Migraciones, seed y suite de aislamiento
        run: pnpm ci:db

      - name: Cobertura de packages/db (umbral 90 %)
        run: pnpm cobertura:db

      - name: Cobertura de 003 cifrado (umbral 90 %)
        run: pnpm cobertura:crypto
