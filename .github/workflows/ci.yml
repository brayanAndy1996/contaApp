name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Instalar, lint, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm (versión de packageManager en package.json)
        uses: pnpm/action-setup@v6

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Cobertura de @contapp/domain (90 % por archivo)
        run: pnpm cobertura:dominio

      - name: Cobertura de @contapp/storage (90 % por archivo)
        run: pnpm cobertura:storage

      - name: Cobertura de @contapp/sunat (90 % por archivo)
        run: pnpm cobertura:sunat

  aislamiento:
    name: Aislamiento entre estudios (PostgreSQL 17)
    runs-on: ubuntu-latest
    env:
      MIGRATIONS_DATABASE_URL: postgresql://postgres@localhost:5432/contapp
      KEY_PROVIDER: mock
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm (versión de packageManager en package.json)
        uses: pnpm/action-setup@v6

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generar DATABASE_URL del rol de app (contraseña por corrida)
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${PASS}"
          echo "DATABASE_URL=postgresql://contapp_app:${PASS}@localhost:5432/contapp" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de @contapp/shared y @contapp/db
        run: pnpm --filter @contapp/shared build && pnpm --filter @contapp/db build

      - name: Build de @contapp/crypto
        run: pnpm --filter @contapp/crypto build

      - name: Migraciones, seed y suite de aislamiento
        run: pnpm ci:db

      - name: Cobertura de 004 auth (umbral 90 % por archivo)
        run: pnpm cobertura:auth
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de 005 acceso (umbral 90 % por archivo)
        run: pnpm cobertura:acceso
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de 008 cola (umbral 90 % por archivo)
        run: pnpm cobertura:cola
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de 016 XML en backend y worker (umbral 90 % por archivo)
        run: pnpm cobertura:xml
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de 012b archivos en backend y worker (umbral 90 % por archivo)
        run: pnpm cobertura:archivos
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de 017 auditoría y notificaciones en backend y worker (umbral 90 % por archivo)
        run: pnpm cobertura:auditoria
        env:
          CORREO_PROVIDER: consola
          APP_ORIGIN: http://localhost:3000

      - name: Cobertura de packages/db (umbral 90 %)
        run: pnpm cobertura:db

      - name: Cobertura de 003 cifrado (umbral 90 %)
        run: pnpm cobertura:crypto

      # Las pruebas de cierre lanzan su propio redis-server (puerto propio); ubuntu-latest no lo trae.
      # policy-rc.d evita que apt arranque el servicio del sistema (el 6379 ya lo usa el contenedor redis7).
      - name: Instalar redis-server (binario para las pruebas de cierre)
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends redis-server
          sudo rm -f /usr/sbin/policy-rc.d
          redis-server --version

      - name: Pruebas de cierre de 008 (paso aparte, al final y en serie, con la BD despejada)
        run: pnpm ci:cierre

  e2e:
    name: E2E de R1 (Playwright, Chromium y Mailpit)
    # P-1 y P-5: corre en PR y en push a main; en otras ramas, solo a mano (workflow_dispatch).
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATIONS_DATABASE_URL: postgresql://postgres@localhost:5432/contapp
      REDIS_URL: redis://localhost:6379
      E2E_CORREO: mailpit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pnpm (versión de packageManager en package.json)
        uses: pnpm/action-setup@v6

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Generar DATABASE_URL del rol de app (contraseña por corrida)
        run: |
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::${PASS}"
          echo "DATABASE_URL=postgresql://contapp_app:${PASS}@localhost:5432/contapp" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Versión de Playwright (exacta, de tests/e2e/package.json)
        id: playwright
        run: |
          V="$(node -p "require('./tests/e2e/package.json').devDependencies['@playwright/test']")"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::@playwright/test debe fijarse en versión exacta"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Caché de Chromium (por versión de Playwright)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Instalar Chromium y sus dependencias del sistema
        run: pnpm --filter @contapp/tests-e2e exec playwright install --with-deps chromium

      - name: E2E sin @volumen (compila la pila y la corre)
        run: pnpm e2e

      - name: E2E @volumen (solo push a main y a mano)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: pnpm e2e:volumen

      - name: Reporte y trazas de la E2E (solo si falla, 7 días)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fallos
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
